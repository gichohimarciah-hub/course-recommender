<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Recommender</title>
</head>
<body>
    <h1>AI Course Recommender for KCSE Graduates</h1>
    <form action="/recommend" method="POST">
        <label>Enter your KCSE Mean Grade:</label>
        <input type="text" name="mean_grade" required>
        <br><br>
        <label>Enter your best subjects (comma separated):</label>
        <input type="text" name="subjects" required>
        <br><br>
        <button type="submit">Get Recommendations</button>
    </form>
</body>
</html>
